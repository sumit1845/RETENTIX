
spring:
  application:
    name: retentix

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retentix_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8081}

logging:
  level:
    org.springframework.security: INFO
